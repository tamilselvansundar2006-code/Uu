<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>For Nikki 💗</title>

<style>
body {
  margin: 0;
  padding: 0;
  background: black;
  overflow: hidden;
  font-family: Arial, sans-serif;
  display: flex;
  justify-content: center;
  align-items: center;
  height: 100vh;
  flex-direction: column;
  color: white;
}

/* Floating hearts background */
.heart-bg {
  position: fixed;
  width: 100%;
  height: 100%;
  overflow: hidden;
  z-index: 0;
}

.heart-bg span {
  position: absolute;
  font-size: 20px;
  animation: float 6s linear infinite;
}

@keyframes float {
  0% { transform: translateY(100vh); opacity: 1; }
  100% { transform: translateY(-10vh); opacity: 0; }
}

/* Center text */
.message {
  font-size: 34px;
  font-weight: bold;
  text-align: center;
  z-index: 2;
}

/* Big heart button */
.big-heart {
  font-size: 90px;
  cursor: pointer;
  margin-top: 20px;
  transition: transform 0.6s ease;
  z-index: 2;
}

.big-heart.zoom {
  transform: scale(20);
}

/* Video */
video {
  position: fixed;
  top: 0;
  left: 0;
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: none;
  z-index: 5;
}
</style>
</head>

<body>

<div class="heart-bg" id="heartBg"></div>

<div class="message">
  Hello Nikki, I have something for you 💗
</div>

<div class="big-heart" id="heartBtn">💗</div>

<video id="myVideo" src="yourvideo.mp4"></video>

<script>
// Floating 💗 hearts
const heartBg = document.getElementById("heartBg");

for (let i = 0; i < 35; i++) {
  let heart = document.createElement("span");
  heart.innerHTML = "💗";
  heart.style.left = Math.random() * 100 + "vw";
  heart.style.fontSize = (15 + Math.random() * 25) + "px";
  heart.style.animationDuration = (4 + Math.random() * 4) + "s";
  heartBg.appendChild(heart);
}

// Heart click animation + video play
const heartBtn = document.getElementById("heartBtn");
const video = document.getElementById("myVideo");

heartBtn.addEventListener("click", () => {
  heartBtn.classList.add("zoom");

  setTimeout(() => {
    video.style.display = "block";
    video.play();
  }, 600);
});
</script>

</body>
</html>
